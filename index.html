<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran &amp; Arabic Tutor | Ahmed Faioud, Online Worldwide &amp; In-Person Tallinn</title>
<meta name="description" content="Private Quran recitation, Tajweed, and Arabic language lessons for children and adults. Online worldwide and in-person in Tallinn, Estonia.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --gold-dark: #8B6914;
    --deep: #0D1B2A;
    --navy: #162338;
    --teal: #1A4A5A;
    --cream: #FAF6EE;
    --warm-white: #FFFDF8;
    --text-muted: rgba(250,246,238,0.66);
    --border: rgba(201,168,76,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--warm-white);
    background:
      radial-gradient(circle at 50% 0%, rgba(26,74,90,0.55) 0%, rgba(13,27,42,0) 60%),
      var(--deep);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 620px;
    text-align: center;
    padding: 3rem 2.25rem 2.75rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(22,35,56,0.55), rgba(13,27,42,0.25));
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 1.5rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 5.2vw, 2.9rem);
    line-height: 1.15;
    letter-spacing: 0.01em;
    color: var(--warm-white);
    margin-bottom: 1.35rem;
  }

  .rule {
    width: 64px;
    height: 1px;
    background: var(--gold);
    opacity: 0.55;
    margin: 0 auto 1.6rem;
  }

  p {
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.75;
    color: var(--text-muted);
    max-width: 46ch;
    margin: 0 auto 1.1rem;
  }

  p strong {
    color: var(--warm-white);
    font-weight: 500;
  }

  .arabic {
    font-family: 'Amiri', serif;
    font-size: clamp(1.1rem, 3.4vw, 1.45rem);
    line-height: 2.1;
    color: var(--gold-light);
    direction: rtl;
    margin: 2rem auto 0.5rem;
  }

  @media (max-width: 480px) {
    .card { padding: 2.4rem 1.4rem 2.2rem; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Quran &amp; Arabic Tutoring</div>
    <h1>We&rsquo;re taking a short break</h1>
    <div class="rule"></div>
    <p>New lessons and bookings are <strong>paused for now</strong>. The site will be back to normal service soon, insha&rsquo;Allah.</p>
    <p class="arabic">إجازة مؤقتة &mdash; نعود قريبًا إن شاء الله</p>
  </main>
</body>
</html>
